
<header class="ecom-header">
    <div class="top-bar">
      <div class="logo cursor-pointer" routerLink="/">ShopNow</div>
      <div class="search-bar">
        <input type="text" placeholder="Search for products..." (keyup)="onSearch($event)" />
      </div>
      <div class="profile-link">
        <a href="/profile">My Profile</a>
      </div>
    </div>
  
    <nav class="category-menu">
      <ul>
        @for (category of categoryList; track $index) {
            <li (click)="searchCategory(category._id!)"><a>{{category.name}}</a></li>
        }
        
      </ul>
    </nav>
  </header>
